# Serves the built web app from Cloud Run. Same content as the Cloudflare deploy, for networks where
# Cloudflare is unreachable (Spanish ISPs block Cloudflare addresses during football matches).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;

  # Hashed build assets never change under the same name.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
  }

  # The shell and the service worker must always be revalidated, or a phone keeps an old build.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
  location = /sw.js {
    add_header Cache-Control "no-cache";
    add_header Content-Type "text/javascript";
  }

  # Everything else is the single page app: /itnig-demo, /tungsten and so on.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
