name: Web CI/CD

# Pull requests run the checks. Merging to main runs the same checks, then deploys to Cloudflare.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WRANGLER_SEND_METRICS: 'false'

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_DEBUG_MODE: ${{ vars.VITE_DEBUG_MODE }}
          VITE_VOICE_ISOLATION: ${{ vars.VITE_VOICE_ISOLATION }}
      # Prove the Cloudflare config is valid on every PR without needing credentials.
      - run: npx wrangler deploy --dry-run
        working-directory: apps/web

  deploy:
    name: Deploy to Cloudflare
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ vars.WEB_URL }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set. Skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.creds.outputs.ready == 'true'
      - uses: actions/setup-node@v7
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        if: steps.creds.outputs.ready == 'true'
      - run: npm run build
        if: steps.creds.outputs.ready == 'true'
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_DEBUG_MODE: ${{ vars.VITE_DEBUG_MODE }}
          VITE_VOICE_ISOLATION: ${{ vars.VITE_VOICE_ISOLATION }}
      - run: npx wrangler deploy
        if: steps.creds.outputs.ready == 'true'
        working-directory: apps/web
